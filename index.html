<title>台股與美股含息回測</title>
<meta name="description" content="台股與美股含息報酬回測，支援單筆投入、定期定額、股息再投入、月均價買入、比較表與互動資產曲線。">
<style>
:root{font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#172033;background:#f5f7fa;line-height:1.5}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa}button,input{font:inherit}button{cursor:pointer}main{max-width:1200px;margin:auto;padding:26px 18px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.eyebrow{margin:0 0 5px;color:#526d82;font-size:12px;font-weight:800;letter-spacing:.1em}.hero h1{margin:0;font-size:clamp(28px,4vw,42px)}.hero p{margin:8px 0 0;color:#5d6b7c}.badge{white-space:nowrap;padding:8px 12px;border-radius:999px;background:#fff3cd;color:#6b5200;border:1px solid #ead98b;font-weight:750}.badge.ok{background:#e9f7ee;color:#176b39;border-color:#b8e2c6}.panel,.settings,.results,.notice{background:#fff;border:1px solid #dce3eb;border-radius:16px;box-shadow:0 8px 28px rgba(30,45,70,.045)}.settings{padding:17px 18px;margin-bottom:16px}.settings-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end}.settings label,.field label{display:block;font-weight:760;margin-bottom:7px}.settings small{display:block;margin-top:7px;color:#66758a}.settings input,.field input{width:100%;padding:11px 12px;border:1px solid #c9d3df;border-radius:10px;background:white}.panel{padding:20px}.field{margin-bottom:16px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.symbol-field{position:relative}.dropdown{position:absolute;z-index:20;top:76px;left:0;right:0;background:#fff;border:1px solid #ccd6e2;border-radius:12px;box-shadow:0 12px 30px rgba(30,45,70,.14);max-height:330px;overflow:auto}.dropdown button{width:100%;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #edf1f5;background:#fff}.dropdown button:hover{background:#f2f7fb}.dropdown button strong{font-variant-numeric:tabular-nums}.dropdown button small{color:#6b778c}.selection{margin:7px 0 0;color:#5b6b7f;font-size:14px}.segmented{display:grid;grid-template-columns:1fr 1fr;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden}.segmented button{padding:10px;border:0;background:#fff}.segmented button.active{background:#172b4d;color:#fff}.switches{display:flex;flex-wrap:wrap;gap:20px;margin:8px 0 18px}.switches label{font-weight:650}.primary,.secondary{border:0;border-radius:10px;padding:11px 16px;font-weight:800}.primary{background:#1976d2;color:#fff;min-width:150px}.primary:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#eef3f8;color:#243b53}.status{margin:12px 0 0;color:#334e68;white-space:pre-line}.notice{padding:13px 15px;margin-bottom:16px;color:#4b5f73;background:#f9fbfd}.notice strong{color:#263b50}.fx-note{display:grid;gap:4px;background:#f2f7fc;border:1px solid #d8e6f2;border-radius:12px;padding:12px 14px;margin-bottom:15px}.fx-note span{color:#526174}.results{margin-top:18px;padding:18px}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.result-card{border:1px solid #dde5ee;border-radius:14px;padding:15px}.result-card h2{font-size:19px;margin:0 0 10px}.result-card h2 span{font-size:14px;font-weight:600;color:#637083}.result-card h2 em{display:inline-block;font-style:normal;font-size:11px;margin-left:5px;background:#eef3f8;border-radius:999px;padding:3px 7px}.result-card dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.result-card dl div{background:#f8fafc;border-radius:9px;padding:9px}.result-card dt{font-size:12px;color:#65758b}.result-card dd{margin:2px 0 0;font-weight:800}.result-card p{font-size:13px;color:#65758b}.result-card details{font-size:13px}.chart-wrap{margin-top:18px;border:1px solid #dde5ee;border-radius:14px;padding:12px}.chart-title{font-weight:800;margin:0 0 8px}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:6px 0 8px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:18px;height:3px;background:#222;display:inline-block}canvas{width:100%;height:360px;display:block;background:#fff;border-radius:8px}footer{margin-top:20px;color:#6b778c;font-size:13px;text-align:center}.warning{color:#8a5a00}.error{color:#a61b1b}.muted{color:#6b778c}.purchase-note{margin:-2px 0 14px;color:#526174;font-size:14px}.comparison-wrap{overflow-x:auto;border:1px solid #dde5ee;border-radius:14px}.comparison-table{width:100%;min-width:920px;border-collapse:separate;border-spacing:0;background:#fff}.comparison-table th,.comparison-table td{padding:13px 15px;border-right:1px solid #e7edf3;border-bottom:1px solid #e7edf3;text-align:right;vertical-align:middle;white-space:nowrap}.comparison-table thead th{background:#eef3f8;color:#1e2a3b;font-weight:850}.comparison-table th:first-child,.comparison-table td:first-child{text-align:left;font-weight:800}.comparison-table tbody tr:first-child{background:#eef6ff}.comparison-table tbody tr:hover{background:#f7fafc}.comparison-table tbody tr:first-child:hover{background:#e8f3ff}.comparison-table tr:last-child td{border-bottom:0}.comparison-table th:last-child,.comparison-table td:last-child{border-right:0}.comparison-table .symbol-name{display:block;color:#66758a;font-size:12px;font-weight:600;margin-top:2px}.comparison-table .usd-tag{display:inline-block;font-size:10px;background:#eef3f8;border-radius:999px;padding:2px 6px;margin-left:4px}.comparison-table .fetch-error{color:#a61b1b;font-weight:700;text-align:left}.result-notes{margin-top:12px;font-size:13px;color:#5f6f82}.result-notes details{border:1px solid #e1e7ee;border-radius:10px;padding:9px 11px;margin-top:8px;background:#fbfcfe}.canvas-shell{min-width:0;position:relative}.chart-tooltip{position:absolute;z-index:20;pointer-events:none;width:min(310px,calc(100vw - 42px));border:1px solid #cfd9e5;background:rgba(255,255,255,.97);box-shadow:0 12px 32px rgba(23,43,77,.18);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;color:#43536a;backdrop-filter:blur(4px)}.chart-tooltip[hidden]{display:none}.chart-tooltip strong{color:#172033}.chart-tooltip .tip-date{font-size:12px;color:#65758b;margin-bottom:2px}.chart-tooltip .tip-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:center}.chart-tooltip .tip-dot{width:9px;height:9px;border-radius:50%}.chart-tooltip .tip-value{text-align:right;font-weight:800;color:#172033}.chart-tooltip .tip-symbol{font-weight:700}.chart-tooltip .tip-trade-date{display:block;color:#7a8797;font-size:10px}.axis-point{display:none}@media(max-width:760px){.hero{display:block}.hero-side{align-items:flex-start;margin-top:12px}.badge{display:inline-block;margin-top:0}.field-grid,.settings-row{grid-template-columns:1fr}.dropdown{top:76px}.result-card dl{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <h1>台股與美股含息回測</h1>
    </div>
    <div class="hero-side">
      <span id="fxBadge" class="badge">今日匯率：讀取中…</span>
      <span id="workerBadge" class="badge">Yahoo 連線檢查中</span>
    </div>
  </header>

  <form id="form" class="panel">
    <section class="field symbol-field">
      <label for="symbol">股票名稱或代號（台股或美股）</label>
      <input id="symbol" value="2330" autocomplete="off" placeholder="例如 23、2330、台積電、AAPL、Apple" />
      <div id="dropdown" class="dropdown" hidden></div>
      <p id="selection" class="selection">已選：2330.TW 台積電</p>
    </section>

    <section class="field-grid">
      <div class="field"><label for="start">開始日期</label><input id="start" type="date" min="1990-01-01" value="2015-01-01" /></div>
      <div class="field"><label for="end">結束日期</label><input id="end" type="date" /></div>
      <div class="field">
        <label>投入方式</label>
        <div class="segmented"><button id="lumpBtn" type="button" class="active">單筆投入</button><button id="monthlyBtn" type="button">每月定期定額</button></div>
      </div>
      <div class="field"><label id="amountLabel" for="amount">投入金額（TWD）</label><input id="amount" type="number" min="1" step="1" inputmode="numeric" value="1000000" /></div>
    </section>

    <p class="purchase-note">買入價格：採該月份可用交易日收盤價的平均值。</p>

    <section class="switches">
      <label><input id="reinvest" type="checkbox" checked /> 股息再投入</label>
      <input id="benchmarks" type="checkbox" checked hidden />
    </section>

    <button id="runBtn" class="primary" type="submit">開始回測</button>
    <p id="status" class="status" role="status"></p>
  </form>

  <section id="results" class="results" hidden>
    <div class="comparison-wrap">
      <table id="comparisonTable" class="comparison-table"></table>
    </div>
    <div id="resultNotes" class="result-notes"></div>
    <div class="chart-wrap">
      <p class="chart-title">資產曲線（TWD）</p>
      <div id="legend" class="legend"></div>
      <div class="canvas-shell">
        <canvas id="chart"></canvas>
        <div id="chartTooltip" class="chart-tooltip" hidden></div>
      </div>
    </div>
  </section>

  <footer>資料來源：Yahoo Finance。比較基準預設包含 0050、00631L、SPY 與 ^TWII；其中 ^TWII 為台灣加權價格指數，並非官方含息報酬指數。本工具僅供研究與教育用途，不構成投資建議。</footer>
</main>
<script>
(() => {
  'use strict';

  const QUICK = [
    {symbol:'2301.TW',display:'2301',name:'光寶科',exchange:'Taiwan',currency:'TWD'},
    {symbol:'2308.TW',display:'2308',name:'台達電',exchange:'Taiwan',currency:'TWD'},
    {symbol:'2330.TW',display:'2330',name:'台積電',exchange:'Taiwan',currency:'TWD'},
    {symbol:'0050.TW',display:'0050',name:'元大台灣50',exchange:'Taiwan',currency:'TWD'},
    {symbol:'00631L.TW',display:'00631L',name:'元大台灣50正2',exchange:'Taiwan',currency:'TWD'},
    {symbol:'AAPL',display:'AAPL',name:'Apple Inc.',exchange:'US',currency:'USD'},
    {symbol:'MSFT',display:'MSFT',name:'Microsoft',exchange:'US',currency:'USD'},
    {symbol:'NVDA',display:'NVDA',name:'NVIDIA',exchange:'US',currency:'USD'},
    {symbol:'SPY',display:'SPY',name:'SPDR S&P 500 ETF Trust',exchange:'US',currency:'USD'},
  ];

  const BENCHMARKS = [
    {symbol:'0050.TW',display:'0050',name:'元大台灣50',exchange:'Taiwan',currency:'TWD',benchmark:true},
    {symbol:'00631L.TW',display:'00631L',name:'元大台灣50正2',exchange:'Taiwan',currency:'TWD',benchmark:true},
    {symbol:'SPY',display:'SPY',name:'S&P 500 可投資代理',exchange:'US',currency:'USD',benchmark:true},
    {symbol:'^TWII',display:'^TWII',name:'台灣加權價格指數（非含息）',exchange:'Taiwan Index',currency:'TWD',benchmark:true,priceIndex:true},
  ];

  const $ = (id) => document.getElementById(id);
  $('end').value = new Date().toISOString().slice(0,10);
  let mode = 'lumpSum';
  let selected = QUICK.find(x => x.symbol === '2330.TW');
  const workerBase = 'https://dark-snowflake-d965.jimmyshieh30.workers.dev';
  let searchTimer = null;
  let searchSeq = 0;

  checkWorker();
  loadTodayFx();

  async function checkWorker() {
    try {
      const data = await api('/health');
      updateWorkerBadge(true, data.provider || 'Yahoo Finance');
    } catch (e) {
      updateWorkerBadge(false);
      setStatus(`資料服務暫時無法連線：${e.message}`, 'error');
    }
  }


  async function loadTodayFx() {
    const badge = $('fxBadge');
    try {
      const today = localDateIso(new Date());
      const start = addDays(today, -10);
      const data = await fetchChart('TWD=X', start, today);
      const bars = (data.bars || []).filter(x => Number.isFinite(Number(x.close)));
      if (!bars.length) throw new Error('沒有可用匯率');
      const latest = bars[bars.length - 1];
      const rate = Number(latest.close);
      badge.textContent = `今日匯率：1 美元 = ${rate.toFixed(2)} 台幣`;
      badge.className = 'badge ok';
      badge.title = latest.date === today
        ? `Yahoo USD/TWD，資料日期 ${latest.date}`
        : `今日非外匯交易日或尚未更新，採最近可用資料 ${latest.date}`;
    } catch (e) {
      badge.textContent = '今日匯率：暫時無法取得';
      badge.className = 'badge';
      badge.title = e?.message || String(e);
    }
  }

  function localDateIso(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function updateWorkerBadge(ok, provider='Yahoo Finance') {
    $('workerBadge').textContent = ok ? `${provider} 已連線` : 'Yahoo 連線失敗';
    $('workerBadge').className = ok ? 'badge ok' : 'badge';
  }

  $('lumpBtn').addEventListener('click', () => setMode('lumpSum'));
  $('monthlyBtn').addEventListener('click', () => setMode('monthly'));
  function setMode(next) {
    mode = next;
    $('lumpBtn').classList.toggle('active', mode === 'lumpSum');
    $('monthlyBtn').classList.toggle('active', mode === 'monthly');
    $('amountLabel').textContent = mode === 'lumpSum' ? '投入金額（TWD）' : '每月投入金額（TWD）';
  }

  $('symbol').addEventListener('input', () => {
    selected = null;
    $('selection').textContent = '請從下拉選單選取；也可輸入完整 Yahoo 代號。';
    clearTimeout(searchTimer);
    const raw = $('symbol').value.trim();
    showLocalMatches(raw);
    if (workerBase && raw) searchTimer = setTimeout(() => remoteSearch(raw), 260);
  });

  $('symbol').addEventListener('focus', () => showLocalMatches($('symbol').value.trim()));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.symbol-field')) $('dropdown').hidden = true;
  });

  function showLocalMatches(raw) {
    const q = raw.toLowerCase();
    const list = QUICK.filter(x => !q || x.display.toLowerCase().includes(q) || x.symbol.toLowerCase().includes(q) || x.name.toLowerCase().includes(q)).slice(0,12);
    renderDropdown(list);
  }

  async function remoteSearch(raw) {
    const seq = ++searchSeq;
    try {
      const data = await api(`/search?q=${encodeURIComponent(raw)}`);
      if (seq !== searchSeq) return;
      const remote = (data.results || []).map(x => ({
        symbol:x.symbol,
        display:displaySymbol(x.symbol),
        name:x.name || x.symbol,
        exchange:x.exchangeDisplay || x.exchange || '',
        currency:currencyForSymbol(x.symbol, x.currency),
      }));
      const local = QUICK.filter(x => {
        const q=raw.toLowerCase();return x.display.toLowerCase().includes(q)||x.symbol.toLowerCase().includes(q)||x.name.toLowerCase().includes(q);
      });
      const merged = uniqueBySymbol([...local, ...remote]).slice(0,18);
      renderDropdown(merged);
    } catch {
      // Local suggestions remain usable; Yahoo may rate-limit search independently.
    }
  }

  function renderDropdown(items) {
    const box = $('dropdown');
    box.innerHTML = '';
    if (!items.length) { box.hidden = true; return; }
    items.forEach(item => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `<strong>${esc(item.display || item.symbol)}</strong><span>${esc(item.name || item.symbol)}</span><small>${esc(item.exchange || '')}</small>`;
      b.addEventListener('click', () => selectSymbol(item));
      box.appendChild(b);
    });
    box.hidden = false;
  }

  function selectSymbol(item) {
    selected = {...item, currency:currencyForSymbol(item.symbol,item.currency)};
    $('symbol').value = item.display || displaySymbol(item.symbol);
    $('selection').textContent = `已選：${item.symbol} ${item.name || ''}`;
    $('dropdown').hidden = true;
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const start = $('start').value;
    const end = $('end').value;
    const amount = Number($('amount').value);
    if (!start || !end || start > end) return setStatus('請確認開始與結束日期。', 'error');
    if (!Number.isInteger(amount) || amount <= 0) return setStatus('投入金額請輸入大於 0 的正整數。', 'error');

    const mainSymbol = selected || inferManualSymbol($('symbol').value);
    if (!mainSymbol) return setStatus('無法判斷股票代號。台股可輸入 2330，美股可輸入 AAPL。', 'error');

    $('runBtn').disabled = true;
    $('results').hidden = true;
    setStatus('正在向 Yahoo Finance 取得歷史資料…');

    try {
      const priceFetchStart = monthStart(start);
      const mainDataset = await fetchDatasetWithTaiwanFallback(mainSymbol, priceFetchStart, end);
      const resolvedMain = {...mainSymbol, symbol:mainDataset.symbol, display:displaySymbol(mainDataset.symbol), currency:currencyForSymbol(mainDataset.symbol, mainDataset.currency)};
      if (!mainDataset.bars.length) throw new Error(`${resolvedMain.symbol} 沒有可用歷史價格。`);

      const configs = [{symbol:resolvedMain, dataset:mainDataset}];
      const benchmarkFailures = [];
      setStatus('主標的資料完成，正在逐一取得比較基準…');
      const seen = new Set([resolvedMain.symbol]);
      for (const b of BENCHMARKS.filter(x => !seen.has(x.symbol))) {
        try {
          const dataset = await fetchDatasetWithTaiwanFallback(b, priceFetchStart, end);
          if (!dataset?.bars?.length) throw new Error('沒有可用歷史價格');
          configs.push({symbol:b, dataset});
        } catch (err) {
          benchmarkFailures.push({symbol:b, error:err?.message || String(err)});
        }
        await sleep(120);
      }

      const needsFx = configs.some(x => currencyForSymbol(x.dataset.symbol,x.dataset.currency) === 'USD');
      let fxDataset = null;
      if (needsFx) {
        setStatus('正在取得 Yahoo USD/TWD 歷史匯率…');
        fxDataset = await fetchChart('TWD=X', addDays(start,-10), end);
        if (!fxDataset.bars.length) throw new Error('無法取得 USD/TWD 歷史匯率。');
      }

      setStatus('正在計算回測…');
      const results = [];
      for (const item of configs) {
        const result = backtest(item.symbol, item.dataset, {
          startDate:start,
          endDate:end,
          mode,
          amountTwd:amount,
          reinvest:$('reinvest').checked,
          fxDataset,
        });
        if (item.symbol.priceIndex) result.warnings.push('^TWII 是台灣加權「價格指數」，不含股息，僅供大盤價格走勢比較。');
        results.push(result);
      }
      renderResults(results, benchmarkFailures);
      const failMsg = benchmarkFailures.length
        ? `；${benchmarkFailures.map(x=>x.symbol.display||displaySymbol(x.symbol.symbol)).join('、')} 資料取得失敗`
        : '';
      setStatus(`完成：共計算 ${results.length} 個標的${failMsg}。Yahoo 資料實際可用起日可能晚於你輸入的日期。`);
    } catch (err) {
      setStatus(`回測失敗：${err.message}`, 'error');
    } finally {
      $('runBtn').disabled = false;
    }
  });

  async function fetchDatasetWithTaiwanFallback(symbolInfo, start, end) {
    const raw = symbolInfo.symbol || symbolInfo.display;
    if (/^\d{4,6}[A-Z]?$/i.test(raw)) {
      try { return await fetchChart(`${raw}.TW`, start, end); }
      catch (first) {
        try { return await fetchChart(`${raw}.TWO`, start, end); }
        catch { throw first; }
      }
    }
    return fetchChart(raw, start, end);
  }

  async function fetchChart(symbol, start, end) {
    return api(`/chart?symbol=${encodeURIComponent(symbol)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
  }

  async function api(path, maxRetries=2) {
    let lastError = null;
    for (let attempt=0; attempt<=maxRetries; attempt++) {
      try {
        const response = await fetch(workerBase + path, {headers:{Accept:'application/json'}});
        let data = null;
        try { data = await response.json(); } catch { /* ignore */ }
        if (response.ok) return data;
        lastError = new Error(data?.error || `${response.status} ${response.statusText}`);
        if (!(response.status===429 || response.status>=500) || attempt===maxRetries) throw lastError;
      } catch (err) {
        lastError = err;
        if (attempt===maxRetries) throw err;
      }
      await sleep(450 * Math.pow(2, attempt));
    }
    throw lastError || new Error('資料取得失敗');
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function backtest(symbol, dataset, config) {
    const warnings = [];
    const allBars = (dataset.bars || [])
      .filter(b => b.date <= config.endDate && Number(b.close) > 0)
      .sort((a,b)=>a.date.localeCompare(b.date));
    const bars = allBars.filter(b => b.date >= config.startDate);
    if (!bars.length) throw new Error(`${symbol.symbol} 在選定期間沒有價格資料`);

    const assetCurrency = currencyForSymbol(dataset.symbol,dataset.currency);
    const requiresFx = assetCurrency === 'USD';
    const fxPoints = requiresFx ? normalizeFx(config.fxDataset?.bars || []) : [];
    const fxFallbackDates = new Set();
    let lastFxIndex = 0;

    function getFx(date) {
      if (!requiresFx) return 1;
      while (lastFxIndex + 1 < fxPoints.length && fxPoints[lastFxIndex + 1].date <= date) lastFxIndex++;
      let p = fxPoints[lastFxIndex];
      if (!p || p.date > date) {
        let lo=0,hi=fxPoints.length-1,ans=-1;
        while(lo<=hi){const mid=(lo+hi)>>1;if(fxPoints[mid].date<=date){ans=mid;lo=mid+1}else hi=mid-1;}
        if(ans<0) throw new Error(`${date} 之前沒有 USD/TWD 匯率`);
        p=fxPoints[ans];lastFxIndex=ans;
      }
      if (p.date !== date) fxFallbackDates.add(date);
      return p.rate;
    }

    const allSplitEvents = (dataset.splits || [])
      .map(s => ({date:s.date,ratio:Number(s.ratio||1)}))
      .filter(s => s.date && s.date <= config.endDate && Number.isFinite(s.ratio) && s.ratio > 0)
      .sort((a,b)=>a.date.localeCompare(b.date));

    const divMap = new Map();
    (dataset.dividends || []).forEach(d => { if(d.date>=config.startDate&&d.date<=config.endDate) divMap.set(d.date,(divMap.get(d.date)||0)+Number(d.amount||0)); });
    const splitMap = new Map();
    allSplitEvents.forEach(s => { if(s.date>=config.startDate) splitMap.set(s.date,(splitMap.get(s.date)||1)*s.ratio); });

    // 每月收盤價平均。若該月有拆股，先把每天價格換算成「買入事件當日」的同一股數基準再平均。
    const monthBars = new Map();
    allBars.forEach(b => {
      const ym = b.date.slice(0,7);
      if (!monthBars.has(ym)) monthBars.set(ym, []);
      monthBars.get(ym).push(b);
    });
    function monthlyAveragePrice(eventDate) {
      const ym = eventDate.slice(0,7);
      const list = monthBars.get(ym) || [];
      if (!list.length) throw new Error(`${eventDate} 所在月份沒有可用價格`);
      let total = 0, count = 0;
      for (const b of list) {
        let price = Number(b.close);
        if (!(price > 0)) continue;
        if (b.date < eventDate) {
          for (const s of allSplitEvents) if (s.date > b.date && s.date <= eventDate) price /= s.ratio;
        } else if (b.date > eventDate) {
          for (const s of allSplitEvents) if (s.date > eventDate && s.date <= b.date) price *= s.ratio;
        }
        total += price; count++;
      }
      if (!count) throw new Error(`${ym} 無法計算月均價`);
      return total / count;
    }

    let shares = 0;
    let cashAsset = 0;
    let contributedTwd = 0;
    let dividendsAsset = 0;
    let dividendsTwdAtEvent = 0;
    let lastContributionMonth = null;
    let lumpDone = false;
    const cashFlows = [];
    const timeline = [];

    for (const bar of bars) {
      const date = bar.date;
      const close = Number(bar.close);
      const fx = getFx(date);

      const split = splitMap.get(date);
      if (split && split > 0 && split !== 1) shares *= split;

      const dividendPerShare = divMap.get(date) || 0;
      if (dividendPerShare > 0 && shares > 0) {
        const dividend = shares * dividendPerShare;
        dividendsAsset += dividend;
        dividendsTwdAtEvent += dividend * fx;
        if (config.reinvest) {
          const reinvestPrice = monthlyAveragePrice(date);
          shares += dividend / reinvestPrice;
        } else cashAsset += dividend;
      }

      let investToday = false;
      if (config.mode === 'lumpSum' && !lumpDone) {
        investToday = true;
        lumpDone = true;
      } else if (config.mode === 'monthly') {
        const ym = date.slice(0,7);
        if (ym !== lastContributionMonth) {
          investToday = true;
          lastContributionMonth = ym;
        }
      }

      if (investToday) {
        const twd = config.amountTwd;
        const assetCash = requiresFx ? twd / fx : twd;
        const buyPrice = monthlyAveragePrice(date);
        shares += assetCash / buyPrice;
        contributedTwd += twd;
        cashFlows.push({date, amount:-twd});
      }

      const valueAsset = shares * close + cashAsset;
      const valueTwd = valueAsset * fx;
      timeline.push({date,value:valueTwd,valueAsset,shares,cashAsset,fxRate:requiresFx?fx:undefined});
    }

    const last = timeline[timeline.length-1];
    cashFlows.push({date:last.date,amount:last.value});
    const profit = last.value - contributedTwd;
    const annualizedReturn = xirr(cashFlows);
    if (bars[0].date !== config.startDate) warnings.push(`實際回測起日調整為第一個有資料的交易日 ${bars[0].date}。`);
    if (bars[bars.length-1].date !== config.endDate) warnings.push(`實際回測終日為最後一個有資料的交易日 ${bars[bars.length-1].date}。`);
    warnings.push('買入價格採當月可用交易日收盤價平均；若月份內有拆股，會先換算到相同股數基準再平均。');
    warnings.push('每日資產市值仍使用當日收盤價；股息事件依 Yahoo 股息資料計算。');
    warnings.push('回測允許碎股，未計入手續費、證交稅、換匯價差與美股股息預扣稅。');

    return {
      symbol:{...symbol,currency:assetCurrency},
      effectiveStartDate:bars[0].date,
      effectiveEndDate:bars[bars.length-1].date,
      contributed:contributedTwd,
      endingValue:last.value,
      endingValueInAssetCurrency:last.valueAsset,
      totalReturnAmount:profit,
      totalReturnRate:contributedTwd ? profit/contributedTwd : 0,
      annualizedReturn,
      dividendsReceived:dividendsTwdAtEvent,
      dividendsReceivedInAssetCurrency:dividendsAsset,
      shares,
      cash:last.cashAsset*last.fxRate || last.cashAsset,
      cashInAssetCurrency:last.cashAsset,
      endingFxRate:requiresFx?last.fxRate:undefined,
      maxDrawdown:maxDrawdown(timeline),
      timeline,
      warnings,
    };
  }

  function normalizeFx(bars) {
    return bars.map(b => ({date:b.date,rate:Number(b.close)})).filter(x => x.date && Number.isFinite(x.rate) && x.rate>0).sort((a,b)=>a.date.localeCompare(b.date));
  }

  function maxDrawdown(points) {
    let peak = 0, dd = 0;
    for (const p of points) { peak=Math.max(peak,p.value); if(peak>0) dd=Math.min(dd,p.value/peak-1); }
    return dd;
  }

  function xirr(flows) {
    if (flows.length < 2 || !flows.some(f=>f.amount<0) || !flows.some(f=>f.amount>0)) return null;
    const first = new Date(flows[0].date+'T00:00:00Z');
    const npv = rate => flows.reduce((sum,f)=>{
      const years=(new Date(f.date+'T00:00:00Z')-first)/86400000/365.2425;
      return sum+f.amount/Math.pow(1+rate,years);
    },0);
    let low=-.9999,high=10,lv=npv(low),hv=npv(high);
    for(let i=0;i<16&&Math.sign(lv)===Math.sign(hv);i++){high*=2;hv=npv(high);}
    if(Math.sign(lv)===Math.sign(hv))return null;
    for(let i=0;i<220;i++){const mid=(low+high)/2,v=npv(mid);if(Math.abs(v)<1e-7)return mid;if(Math.sign(v)===Math.sign(lv)){low=mid;lv=v}else high=mid;}
    return (low+high)/2;
  }

  function renderResults(results, failures=[]) {
    window.__lastResults = results;
    $('results').hidden = false;
    const table = $('comparisonTable');
    const money = new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0});
    const pct = new Intl.NumberFormat('zh-TW',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2});

    const head = `
      <thead>
        <tr>
          <th>標的</th>
          <th>總投入金額</th>
          <th>含息損益</th>
          <th>含息報酬率</th>
          <th>年化報酬率（XIRR）</th>
        </tr>
      </thead>`;

    const okRows = results.map(r => `
      <tr>
        <td>
          ${esc(r.symbol.display||displaySymbol(r.symbol.symbol))}
          <span class="symbol-name">${esc(r.symbol.name||r.symbol.symbol)}${r.symbol.currency==='USD'?'<span class="usd-tag">USD→TWD</span>':''}</span>
        </td>
        <td>${money.format(r.contributed)} TWD</td>
        <td>${money.format(r.totalReturnAmount)} TWD</td>
        <td>${pct.format(r.totalReturnRate)}</td>
        <td>${r.annualizedReturn==null ? 'N/A' : pct.format(r.annualizedReturn)}</td>
      </tr>`).join('');

    const failedRows = failures.map(x => `
      <tr>
        <td>
          ${esc(x.symbol.display||displaySymbol(x.symbol.symbol))}
          <span class="symbol-name">${esc(x.symbol.name||x.symbol.symbol)}</span>
        </td>
        <td colspan="4" class="fetch-error">資料取得失敗：${esc(x.error||'未知錯誤')}</td>
      </tr>`).join('');

    table.innerHTML = head + `<tbody>${okRows}${failedRows}</tbody>`;

    const noteBox = $('resultNotes');
    noteBox.innerHTML = results.map(r => {
      const warn=[...new Set(r.warnings||[])];
      if(!warn.length) return '';
      return `<details><summary>${esc(r.symbol.display||displaySymbol(r.symbol.symbol))} 計算與資料說明</summary><ul>${warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details>`;
    }).join('');

    setupInteractiveChart(results);
  }

  function setupInteractiveChart(results) {
    const canvas = $('chart');
    const shell = canvas.parentElement;
    const tooltip = $('chartTooltip');
    const colors=['#1976d2','#d97706','#16803c','#7c3aed','#c2415b','#0891b2'];
    const dpr=Math.max(1,window.devicePixelRatio||1);
    const h=390;
    const left=66,right=18,top=18,bottom=58;

    const allTimes = results.flatMap(r => r.timeline.map(p => Date.parse(p.date+'T00:00:00Z'))).filter(Number.isFinite);
    const allValues = results.flatMap(r => r.timeline.map(p => p.value)).filter(Number.isFinite);
    if(!allTimes.length || !allValues.length) return;
    const minTime=Math.min(...allTimes), maxTime=Math.max(...allTimes);
    let minVal=Math.min(...allValues), maxVal=Math.max(...allValues);
    if(minVal===maxVal){minVal*=.9;maxVal*=1.1;}
    const pointCount=20;
    const sampleTimes=Array.from({length:pointCount},(_,i)=>minTime+(maxTime-minTime)*(i/(pointCount-1)));

    $('legend').innerHTML='';
    results.forEach((r,idx)=>{const s=document.createElement('span');s.innerHTML=`<i style="background:${colors[idx%colors.length]}"></i>${esc(r.symbol.display||displaySymbol(r.symbol.symbol))}`;$('legend').appendChild(s);});

    function resize() {
      const w=Math.max(360,shell.clientWidth);
      canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
      return w;
    }

    function pointAtOrBefore(timeline, targetMs) {
      let lo=0,hi=timeline.length-1,ans=-1;
      while(lo<=hi){const mid=(lo+hi)>>1;const t=Date.parse(timeline[mid].date+'T00:00:00Z');if(t<=targetMs){ans=mid;lo=mid+1}else hi=mid-1;}
      return ans>=0?timeline[ans]:null;
    }

    function isoFromMs(ms){return new Date(ms).toISOString().slice(0,10);}
    function twd(v){return Number.isFinite(v)?`${Math.round(v).toLocaleString('zh-TW')} TWD`:'—';}

    function paint(hoverIndex=null) {
      const w=resize();
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      const pw=w-left-right,ph=h-top-bottom;
      const xForTime=t=>left+pw*((t-minTime)/Math.max(1,maxTime-minTime));
      const yForVal=v=>top+ph*(1-(v-minVal)/(maxVal-minVal));

      // horizontal value grid
      ctx.strokeStyle='#dfe6ee';ctx.lineWidth=1;ctx.fillStyle='#66758a';ctx.font='12px system-ui';
      for(let i=0;i<=4;i++){const y=top+ph*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();const val=maxVal-(maxVal-minVal)*i/4;ctx.fillText(compact(val),4,y+4);}

      // 20 time-axis points
      sampleTimes.forEach((t,i)=>{
        const x=xForTime(t);
        ctx.strokeStyle=i===hoverIndex?'#9fb8d2':'#edf1f5';ctx.lineWidth=i===hoverIndex?1.4:1;
        ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+ph);ctx.stroke();
        ctx.beginPath();ctx.fillStyle=i===hoverIndex?'#172b4d':'#a8b5c4';ctx.arc(x,top+ph+7,i===hoverIndex?4:2.6,0,Math.PI*2);ctx.fill();
        if(i%4===0 || i===pointCount-1){const label=isoFromMs(t);ctx.fillStyle='#66758a';ctx.font='11px system-ui';const tw=ctx.measureText(label).width;const lx=Math.min(w-right-tw,Math.max(left,x-tw/2));ctx.fillText(label,lx,h-18);}
      });

      // daily curves on true time axis
      results.forEach((r,idx)=>{
        const pts=r.timeline;if(!pts.length)return;ctx.strokeStyle=colors[idx%colors.length];ctx.lineWidth=2;ctx.beginPath();
        pts.forEach((p,i)=>{const x=xForTime(Date.parse(p.date+'T00:00:00Z')),y=yForVal(p.value);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
      });

      if(hoverIndex!=null){
        const target=sampleTimes[hoverIndex], x=xForTime(target);
        ctx.strokeStyle='#172b4d';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+ph);ctx.stroke();
        results.forEach((r,idx)=>{const p=pointAtOrBefore(r.timeline,target);if(!p)return;const y=yForVal(p.value);ctx.fillStyle=colors[idx%colors.length];ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();});
      }
    }

    function showTooltip(index, pointerX, pointerY){
      const target=sampleTimes[index];
      const rows=results.map((r,idx)=>{
        const p=pointAtOrBefore(r.timeline,target);
        return `<div class="tip-row"><span class="tip-dot" style="background:${colors[idx%colors.length]}"></span><div><span class="tip-symbol">${esc(r.symbol.display||displaySymbol(r.symbol.symbol))}</span>${p?`<span class="tip-trade-date">資料日 ${p.date}</span>`:''}</div><span class="tip-value">${p?twd(p.value):'—'}</span></div>`;
      }).join('');
      tooltip.innerHTML=`<strong>當時資產</strong><span class="tip-date">${isoFromMs(target)}</span>${rows}`;
      tooltip.hidden=false;

      const shellRect=shell.getBoundingClientRect();
      const tipW=tooltip.offsetWidth || 300;
      const tipH=tooltip.offsetHeight || 180;
      let leftPos=pointerX-shellRect.left+14;
      let topPos=pointerY-shellRect.top+14;
      if(leftPos+tipW>shell.clientWidth-8) leftPos=pointerX-shellRect.left-tipW-14;
      if(topPos+tipH>shell.clientHeight-8) topPos=pointerY-shellRect.top-tipH-14;
      tooltip.style.left=Math.max(8,leftPos)+'px';
      tooltip.style.top=Math.max(8,topPos)+'px';
    }

    function hoverFromEvent(ev){
      const rect=canvas.getBoundingClientRect();
      const w=rect.width,pw=w-left-right;
      const x=Math.min(w-right,Math.max(left,ev.clientX-rect.left));
      const ratio=(x-left)/Math.max(1,pw);
      const idx=Math.max(0,Math.min(pointCount-1,Math.round(ratio*(pointCount-1))));
      paint(idx);
      showTooltip(idx, ev.clientX, ev.clientY);
    }

    canvas.onpointermove=hoverFromEvent;
    canvas.onpointerdown=hoverFromEvent;
    canvas.onpointerleave=()=>{paint(null);tooltip.hidden=true;};
    paint(null);
    tooltip.hidden=true;
    window.__chartRepaint=()=>paint(null);
  }

  window.addEventListener('resize',()=>{if(!$('results').hidden&&window.__chartRepaint)window.__chartRepaint();});

  function inferManualSymbol(raw) {
    const q=raw.trim().toUpperCase();
    if(!q)return null;
    const local=QUICK.find(x=>x.display.toUpperCase()===q||x.symbol.toUpperCase()===q);if(local)return local;
    if(/^\d{4,6}[A-Z]?$/.test(q))return {symbol:q,display:q,name:q,exchange:'Taiwan',currency:'TWD'};
    if(/^[A-Z^][A-Z0-9.^=\-]{0,14}$/.test(q))return {symbol:q,display:q,name:q,exchange:'US',currency:currencyForSymbol(q)};
    return null;
  }

  function currencyForSymbol(symbol,currency) {
    if (/\.(TW|TWO)$/i.test(symbol) || symbol==='^TWII') return 'TWD';
    if (currency==='TWD'||currency==='USD') return currency;
    return 'USD';
  }
  function displaySymbol(symbol){return symbol.replace(/\.(TW|TWO)$/i,'');}
  function uniqueBySymbol(items){const seen=new Set();return items.filter(x=>{const k=x.symbol.toUpperCase();if(seen.has(k))return false;seen.add(k);return true;});}
  function addDays(date,days){return new Date(Date.parse(date+'T00:00:00Z')+days*86400000).toISOString().slice(0,10);}
  function monthStart(date){return date.slice(0,7)+'-01';}
  function compact(v){if(Math.abs(v)>=1e8)return(v/1e8).toFixed(1)+'億';if(Math.abs(v)>=1e4)return(v/1e4).toFixed(0)+'萬';return Math.round(v).toLocaleString('zh-TW');}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function setStatus(msg,kind=''){$('status').textContent=msg;$('status').className='status '+kind;}
})();
</script>
</body>
</html>
